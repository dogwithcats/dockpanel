# DockPanel under a sub-path, e.g. https://ops.example.com/dockerpanel/
# Start the panel with BASE_PATH=/dockerpanel TRUST_PROXY=true

# Put this map in the http {} block (once per nginx instance)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name ops.example.com;
    # ssl_certificate / ssl_certificate_key ...

    # "location /dockerpanel/" and "location /dockerpanel" both work,
    # with or without a trailing "/" on proxy_pass.
    location /dockerpanel/ {
        proxy_pass http://127.0.0.1:8080;

        # WebSocket: logs / terminal / stats
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required: the panel compares Origin with Host to block cross-site requests.
        # $http_host keeps the port (use it instead of $host on non-443/80 ports).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived log streams and shell sessions
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }
}
